name: Deploy everglow.cc

# Builds site/ and deploys it to the Cloudflare Worker that serves everglow.cc.
# Pull requests build and validate only; a push to main also deploys.
# The root index.html, privacy.html and terms.html are the GitHub Pages copies that
# older app versions link to (xander12138.github.io/Everglow/...). They are not part of
# this build — leave them in place until no supported app version links to them.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy-site.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pillow==10.3.0"
      - name: Build review and production output
        run: |
          python3 build.py
          python3 build.py --production --domain https://everglow.cc
      - name: Validate
        run: python3 validate.py
      - uses: actions/setup-node@v4
        if: github.event_name != 'pull_request'
        with:
          node-version: "22"
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.148.0 deploy -c wrangler.deploy.json
